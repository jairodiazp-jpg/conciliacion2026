<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#991B1B" flood-opacity="0.3"/>
    </filter>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#DC2626" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#iconShadow)" transform="translate(20, 15)">
    <rect x="0" y="0" width="90" height="90" rx="22" fill="url(#redGradient)" />
    <path d="M 20 45 Q 35 25, 50 45 T 80 45" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 15 55 Q 30 35, 45 55 T 75 55" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 25 65 Q 40 50, 55 65" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="45" cy="25" rx="25" ry="12" fill="white" opacity="0.15"/>
  </g>
  <text x="125" y="75" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="700" fill="url(#redShine)" filter="url(#textShadow)" letter-spacing="2">CALYPSO</text>
  <line x1="125" y1="88" x2="380" y2="88" stroke="url(#redShine)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <text x="127" y="105" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="400" fill="#991B1B" letter-spacing="4" text-transform="uppercase" opacity="0.7">Conciliador</text>
</svg>